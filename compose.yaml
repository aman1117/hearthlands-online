services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: hearthlands
      POSTGRES_USER: hearthlands
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private POSTGRES_PASSWORD before starting Compose}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearthlands -d hearthlands"]
      interval: 5s
      timeout: 3s
      retries: 10
  hearthlands:
    build: .
    environment:
      DATABASE_URL: postgresql://hearthlands@db:5432/hearthlands
      PGUSER: hearthlands
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SCHEMA: hearthlands_game
      DATABASE_SSL: disable
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - game-data:/app/data
    restart: unless-stopped
volumes:
  game-data:
  postgres-data:
